name: Build and release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGE.md'
      - 'doc/*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure node-gyp
        shell: pwsh
        run: |
          npm install --global node-gyp@9
          $nodeGyp = Join-Path (npm root -g) 'node-gyp/bin/node-gyp.js'
          "npm_config_node_gyp=$nodeGyp" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Build Dist
        run: npm run dist
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-win-x64
          path: dist/DoGoBlock-Agent_v*.exe
          retention-days: 1
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libudev-dev libusb-1.0-0-dev rpm

      - name: Install dependencies
        run: npm_config_python="$pythonLocation/bin/python" npm ci

      - name: Build Dist
        run: npm run dist
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-linux
          path: |
            dist/DoGoBlock-Agent_v*.AppImage
            dist/DoGoBlock-Agent_v*.deb
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    needs:
      - build-windows
      - build-linux
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build results
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate checksums
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DoGoBlock Agent ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            checksums.txt
          fail_on_unmatched_files: true

name: Build and release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGE.md'
      - 'doc/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Configure node-gyp
        run: npm config set msvs_version 2019

      - name: Npm Install
        run: npm install

      - name: Build Dist
        run: npm run dist
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-win-x64
          path: dist/DoGoBlock-Agent_v*.exe
          retention-days: 1
          if-no-files-found: error

  build-windows32:
    name: Build Windows x86
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Configure node-gyp
        run: npm config set msvs_version 2019

      - name: Npm Install
        run: npm install

      - name: Build Dist
        run: npm run dist32
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-win-x86
          path: dist/DoGoBlock-Agent_v*.exe
          retention-days: 1
          if-no-files-found: error

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Npm Install
        run: npm install

      - name: Build Dist
        run: npm run dist
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-mac
          path: dist/DoGoBlock-Agent_v*.dmg
          retention-days: 1
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.21.3'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ libudev-dev libusb-1.0-0-dev rpm

      - name: Npm Install
        run: |
          npm config set python python3
          npm install

      - name: Build Dist
        run: npm run dist
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-linux
          path: |
            dist/DoGoBlock-Agent_v*.AppImage
            dist/DoGoBlock-Agent_v*.deb
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    needs:
      - build-windows
      - build-windows32
      - build-mac
      - build-linux
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build results
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate checksums
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DoGoBlock Agent ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            checksums.txt
          fail_on_unmatched_files: true

name: Build and release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGE.md'
      - 'doc/*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release a publicar, por exemplo v1.0.7. Deixe vazio para apenas gerar artifacts.'
        required: false
        type: string
      draft:
        description: 'Criar a release como rascunho'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.0'
  CSC_IDENTITY_AUTO_DISCOVERY: false
  MAX_AGENT_ARTIFACT_MB: '250'

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure node-gyp
        shell: pwsh
        run: |
          npm install --global node-gyp@9
          $nodeGyp = Join-Path (npm root -g) 'node-gyp/bin/node-gyp.js'
          "npm_config_node_gyp=$nodeGyp" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Verify lightweight resources before build
        shell: pwsh
        run: |
          npm run prune:agent -- --dry-run
          node -e "const fs=require('fs'); const pkg=require('./package.json'); console.log('Building DoGoBlock Agent ' + pkg.version); if (fs.existsSync('external-resources')) process.exitCode=1;"

      - name: Build unpacked app
        run: npm run build:pack
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Verify packaged app
        run: npm run verify:package

      - name: Build installers
        run: node scripts/run-electron-builder.js
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Verify artifact size
        shell: pwsh
        run: |
          $limit = [int]$env:MAX_AGENT_ARTIFACT_MB * 1024 * 1024
          $files = Get-ChildItem dist -Filter "DoGoBlock-Agent_v*.exe"
          if ($files.Count -eq 0) { throw "Windows artifact was not generated" }
          foreach ($file in $files) {
            Write-Host "$($file.Name): $([math]::Round($file.Length / 1MB, 2)) MB"
            if ($file.Length -gt $limit) {
              throw "$($file.Name) exceeds $env:MAX_AGENT_ARTIFACT_MB MB"
            }
          }

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-win-x64-${{ github.sha }}
          path: dist/DoGoBlock-Agent_v*.exe
          retention-days: 1
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libudev-dev libusb-1.0-0-dev rpm

      - name: Install dependencies
        run: npm_config_python="$pythonLocation/bin/python" npm ci

      - name: Verify lightweight resources before build
        run: |
          npm run prune:agent -- --dry-run
          node -e "const fs=require('fs'); const pkg=require('./package.json'); console.log('Building DoGoBlock Agent ' + pkg.version); if (fs.existsSync('external-resources')) process.exitCode=1;"

      - name: Build unpacked app
        run: npm run build:pack
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Verify packaged app
        run: npm run verify:package

      - name: Build installers
        run: node scripts/run-electron-builder.js
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192

      - name: Verify artifact size
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const limit = Number(process.env.MAX_AGENT_ARTIFACT_MB) * 1024 * 1024;
          const files = fs.readdirSync('dist')
            .filter(name => /^DoGoBlock-Agent_v.*\.(AppImage|deb)$/.test(name))
            .map(name => path.join('dist', name));
          if (!files.length) {
            throw new Error('Linux artifacts were not generated');
          }
          for (const file of files) {
            const size = fs.statSync(file).size;
            console.log(`${path.basename(file)}: ${(size / 1024 / 1024).toFixed(2)} MB`);
            if (size > limit) {
              throw new Error(`${path.basename(file)} exceeds ${process.env.MAX_AGENT_ARTIFACT_MB} MB`);
            }
          }
          NODE

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DoGoBlockAgent-linux-${{ github.sha }}
          path: |
            dist/DoGoBlock-Agent_v*.AppImage
            dist/DoGoBlock-Agent_v*.deb
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    needs:
      - build-windows
      - build-linux
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag was not provided" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build results
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate checksums
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: DoGoBlock Agent ${{ steps.release.outputs.tag }}
          draft: ${{ steps.release.outputs.draft }}
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            checksums.txt
          fail_on_unmatched_files: true

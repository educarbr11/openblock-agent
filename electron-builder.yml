directories:
  buildResources: buildResources
  output: dist
files:
  - src/**/*
  - package.json
  - "!**/.git/**"
  - "!**/.github/**"
  - "!**/.vscode/**"
  - "!dist/**"
  - "!scripts/**"
  - "!translations/**"
  - "!local-resources/**"
  - "!external-resources/**"
  - "!tools/**"
  - "!firmwares/**"
  - "!drivers/**"
  - "!tmp/**"
  - "!**/*.map"
extraFiles: ["tools", "firmwares", "drivers"]
compression: maximum

appId: 'br.com.dogoblock.agent'
productName: "DoGoBlock Agent"
publish: # empty provider list = don't publish
artifactName: "DoGoBlock-Agent_v${version}_${os}_${arch}.${ext}"

mac:
  category: public.app-category.education
  entitlements: buildResources/entitlements.mac.plist
  gatekeeperAssess: true
  hardenedRuntime: true
  icon: buildResources/OpenblockAgent.icns
  provisioningProfile: embedded.provisionprofile
  target:
    - dmg
    # - mas
dmg:
  title: "DoGoBlock Agent ${version}"
# mas:
#   category: public.app-category.education
#   entitlements: buildResources/entitlements.mas.plist
#   entitlementsInherit: buildResources/entitlements.mas.inherit.plist
#   hardenedRuntime: false
#   icon: buildResources/OpenblockAgent.icns

win:
  icon: buildResources/OpenblockAgent.ico
  target:
    # - appx
    - target: nsis
      arch:
        - x64
# appx:
#   identityName: OpenBlock.OpenblockAgent
#   publisherDisplayName: "OpenBlock"
#   publisher: "CN=2EC43DF1-469A-4119-9AB9-568A0A1FF65F"
#   artifactName: "OpenBlock Agent ${version}.${ext}"
nsis:
  oneClick: false # allow user to choose per-user or per-machine
  allowToChangeInstallationDirectory: true
  include: buildResources/installer.nsh
#   license: LICENSE

linux:
  category: Education
  icon: buildResources/linux
  maintainer: DoGoBlock Team <contato@dogoblock.com.br>
  target:
    - AppImage
    - deb

deb:
  depends: ["libnotify4", "libxtst6", "libnss3"]
